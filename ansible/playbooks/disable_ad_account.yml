---
- name: Disable an AD account only inside the configured non-production OU
  hosts: windows
  gather_facts: false
  tasks:
    - name: Validate the demo OU and requested SamAccountName
      ansible.builtin.assert:
        that:
          - sam_account_name is string
          - sam_account_name is match('^[A-Za-z0-9._$-]{1,20}$')
          - demo_ou_dn is string
          - demo_ou_dn | length > 0
        fail_msg: "A configured demo OU and valid SamAccountName are required."

    - name: Run the registered PowerShell disable script on the target
      ansible.windows.win_powershell:
        script: |
          param(
            [Parameter(Mandatory = $true)][string]$ScriptPath,
            [Parameter(Mandatory = $true)][string]$SamAccountName
          )

          Invoke-Command -ScriptBlock {
            param([string]$Path, [string]$AccountName, [string]$AllowedOuDn)
            $env:ORQIVO_AD_DEMO_OU_DN = $AllowedOuDn
            & $Path -SamAccountName $AccountName
          } -ArgumentList $ScriptPath, $SamAccountName, $DemoOuDn
        parameters:
          ScriptPath: 'C:\Automation\Disable-ADAccount.ps1'
          SamAccountName: "{{ sam_account_name }}"
          DemoOuDn: "{{ demo_ou_dn }}"
      register: disable_result
      no_log: true
      timeout: 120

    - name: Forward PowerShell Write-Host messages to the job console
      ansible.builtin.debug:
        msg: "ORQIVO_POWERSHELL_OUTPUT={{ disable_result.host_out | default('') | b64encode }}"

    - name: Confirm the account is disabled
      ansible.builtin.assert:
        that:
          - disable_result.get('result', {}).get('success', false) | bool
          - not (disable_result.get('result', {}).get('enabled', true) | bool)
        fail_msg: "The requested AD account was not confirmed disabled."
