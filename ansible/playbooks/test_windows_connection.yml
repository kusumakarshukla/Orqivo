---
- name: Test approved Windows WinRM connection
  hosts: windows
  gather_facts: false
  tasks:
    - name: Verify WinRM connectivity
      ansible.windows.win_ping:
      register: connection_result
      no_log: true

    - name: Return structured connection status
      ansible.builtin.debug:
        msg:
          success: "{{ connection_result.ping == 'pong' }}"
          result: "{{ connection_result.ping | default('unavailable') }}"
