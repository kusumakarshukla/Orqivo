openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Orqivo Windows Automation API
servers:
  - url: /api
    description: Base API path
tags:
  - { name: auth, description: Development authentication }
  - { name: dashboard, description: Dashboard aggregates }
  - { name: automations, description: Approved automation catalogue }
  - { name: servers, description: Registered Windows servers }
  - { name: jobs, description: Automation execution jobs }
  - { name: account-state-requests, description: Active Directory account requests with a guarded non-production test execution path }
  - { name: catalogue-requests, description: TechHub account and BitLocker requests }
  - { name: audit, description: Append-only audit history }
  - { name: health, description: Health operations }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a development session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Session ended }
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Job counts and worker state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /v1/dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /v1/admin/automation-tracker:
    get:
      operationId: getAutomationTracker
      tags: [dashboard]
      summary: Get monthly automation analytics
      description: Administrator-only monthly request trends, execution outcomes, year-to-date totals, and top catalogues.
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        "200":
          description: Monthly automation metrics and daily request trend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationTracker" }
  /v1/automations:
    get:
      operationId: listAutomations
      tags: [automations]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: risk, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Approved automations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Automation" }
    post:
      operationId: createAutomation
      tags: [automations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "201":
          description: Created automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
  /v1/automations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAutomation
      tags: [automations]
      responses:
        "200":
          description: Automation definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
    put:
      operationId: updateAutomation
      tags: [automations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "200":
          description: Updated automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
    patch:
      operationId: setAutomationStatus
      tags: [automations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStatusInput" }
      responses:
        "200":
          description: Updated automation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
  /v1/servers:
    get:
      operationId: listServers
      tags: [servers]
      responses:
        "200":
          description: Registered servers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Server" }
    post:
      operationId: createServer
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "201":
          description: Created server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
  /v1/servers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getServer
      tags: [servers]
      responses:
        "200":
          description: Server record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
    put:
      operationId: updateServer
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerInput" }
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
    patch:
      operationId: setServerStatus
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStatusInput" }
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
  /v1/servers/{id}/test-connection:
    post:
      operationId: testServerConnection
      tags: [servers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Simulated or real connection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionResult" }
  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: automation_id, in: query, schema: { type: string, format: uuid } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest], default: newest } }
      responses:
        "200":
          description: Paginated jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
    post:
      operationId: createJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /v1/jobs/export:
    get:
      operationId: exportJobs
      tags: [jobs]
      responses:
        "200":
          description: Sanitized CSV
          content:
            text/csv:
              schema: { type: string }
  /v1/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /v1/jobs/{id}/events:
    get:
      operationId: getJobEvents
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Job timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobEvent" }
  /v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /v1/jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /v1/jobs/{id}/log:
    get:
      operationId: downloadJobLog
      tags: [jobs]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Sanitized job log
          content:
            text/plain:
              schema: { type: string }
  /v1/account-state-requests:
    post:
      operationId: createAccountStateRequest
      tags: [account-state-requests]
      summary: Submit an Active Directory account state request
      description: Disable requests enqueue a playbook only when test mode is enabled and the registered non-production target is valid. Other requests remain intake-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountStateRequestInput" }
      responses:
        "202":
          description: Request recorded or queued for non-production test execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStateRequest" }
    get:
      operationId: listAccountStateRequests
      tags: [account-state-requests]
      summary: List visible Active Directory account requests
      description: Returns up to 100 recent requests. Operators see only their own requests; administrators see all.
      responses:
        "200":
          description: Recent request intake records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountStateRequest" }
  /v1/catalogue-requests:
    post:
      operationId: createCatalogueRequest
      tags: [catalogue-requests]
      summary: Record an account or BitLocker request
      description: Queues permanent and consultant account creation for the configured non-production demo OU when enabled; otherwise records the request for review. BitLocker requests remain review-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueRequestInput" }
      responses:
        "202":
          description: Request recorded or queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueRequest" }
    get:
      operationId: listCatalogueRequests
      tags: [catalogue-requests]
      summary: List visible TechHub catalogue requests
      description: Returns up to 100 recent requests. Operators see their own requests; administrators see all.
      responses:
        "200":
          description: Recent request intake records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueRequest" }
  /v1/catalogue-requests/{request_id}/execute:
    post:
      operationId: executeCatalogueRequest
      tags: [catalogue-requests]
      summary: Queue a submitted account-creation request
      description: Queues an existing unlinked permanent or consultant account request for the configured non-production demo OU. Requires an operator or administrator session and enabled demo execution.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Account-creation job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueRequest" }
        "404":
          description: Request not found
        "409":
          description: Request already linked to a job or not eligible for execution
        "503":
          description: Demo target, worker, or execution configuration unavailable
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      required: [id, email, full_name, role, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    DashboardSummary:
      type: object
      required: [total, running, successful, failed, success_rate, mock_mode, ansible_enabled, worker_online, by_status]
      properties:
        total: { type: integer }
        running: { type: integer }
        successful: { type: integer }
        failed: { type: integer }
        success_rate: { type: number }
        mock_mode: { type: boolean }
        ansible_enabled: { type: boolean }
        worker_online: { type: boolean }
        by_status:
          type: object
          additionalProperties: { type: integer }
    TrackerMetrics:
      type: object
      required: [total_executed, successful, failed, cancelled, success_rate, failure_rate, average_duration_seconds]
      properties:
        total_executed: { type: integer, description: Successful, failed, and timed-out executions. }
        successful: { type: integer }
        failed: { type: integer, description: Failed and timed-out executions. }
        cancelled: { type: integer }
        success_rate: { type: number }
        failure_rate: { type: number }
        average_duration_seconds: { type: ["number", "null"] }
    AutomationTracker:
      allOf:
        - { $ref: "#/components/schemas/TrackerMetrics" }
        - type: object
          required: [year, month, month_label, total_requests, ytd, daily, top_catalogues]
          properties:
            year: { type: integer }
            month: { type: integer }
            month_label: { type: string }
            total_requests: { type: integer, description: Job submissions plus account-state and TechHub catalogue intake requests. }
            ytd: { $ref: "#/components/schemas/TrackerMetrics" }
            daily:
              type: array
              items:
                type: object
                required: [date, job_requests, account_requests, catalogue_requests, total_requests]
                properties:
                  date: { type: string, format: date }
                  job_requests: { type: integer }
                  account_requests: { type: integer }
                  catalogue_requests: { type: integer }
                  total_requests: { type: integer }
            top_catalogues:
              type: array
              items:
                type: object
                required: [code, name, total_executed, successful, failed]
                properties:
                  code: { type: string }
                  name: { type: string }
                  total_executed: { type: integer }
                  successful: { type: integer }
                  failed: { type: integer }
    Automation:
      type: object
      required: [id, code, name, description, playbook_key, powershell_script_key, parameter_schema, risk_level, timeout_seconds, required_role, requires_change_number, requires_confirmation, is_active, target_os, expected_minutes]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        playbook_key: { type: string }
        powershell_script_key: { type: string }
        parameter_schema:
          type: array
          items: { $ref: "#/components/schemas/ParameterDefinition" }
        risk_level: { type: string, enum: [low, medium, high] }
        timeout_seconds: { type: integer }
        required_role: { $ref: "#/components/schemas/Role" }
        requires_change_number: { type: boolean }
        requires_confirmation: { type: boolean }
        is_active: { type: boolean }
        target_os: { type: string }
        expected_minutes: { type: integer }
    ParameterDefinition:
      type: object
      required: [name, label, type, required]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, select, multi-select, number] }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        placeholder: { type: string }
        sensitive: { type: boolean }
        min: { type: number }
        max: { type: number }
    AutomationInput:
      type: object
      required: [code, name, description, playbook_key, powershell_script_key, parameter_schema, risk_level, timeout_seconds, required_role, requires_change_number, requires_confirmation, is_active]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        playbook_key: { type: string }
        powershell_script_key: { type: string }
        parameter_schema:
          type: array
          items: { $ref: "#/components/schemas/ParameterDefinition" }
        risk_level: { type: string, enum: [low, medium, high] }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
        required_role: { $ref: "#/components/schemas/Role" }
        requires_change_number: { type: boolean }
        requires_confirmation: { type: boolean }
        is_active: { type: boolean }
    RecordStatusInput:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }
    Server:
      type: object
      required: [id, name, display_name, hostname, environment, operating_system, winrm_port, use_https, certificate_validation, credential_reference, is_active, last_connection_status, last_connection_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        hostname: { type: string, description: "Private DNS FQDN matching the WinRM TLS certificate; IP addresses are not accepted." }
        environment: { type: string }
        operating_system: { type: string }
        winrm_port: { type: integer }
        use_https: { type: boolean }
        certificate_validation: { type: string }
        credential_reference: { type: string }
        is_active: { type: boolean }
        last_connection_status: { type: string }
        last_connection_at: { type: ["string", "null"], format: date-time }
    ServerInput:
      type: object
      required: [name, display_name, hostname, environment, operating_system, winrm_port, use_https, certificate_validation, credential_reference, is_active]
      properties:
        name: { type: string }
        display_name: { type: string }
        hostname: { type: string, description: "Private DNS FQDN matching the WinRM TLS certificate; IP addresses are not accepted." }
        environment: { type: string }
        operating_system: { type: string }
        winrm_port: { type: integer, enum: [5986] }
        use_https: { type: boolean, enum: [true] }
        certificate_validation: { type: string, enum: [validate] }
        credential_reference: { type: string }
        is_active: { type: boolean }
    ConnectionResult:
      type: object
      required: [success, message, tested_at, mock]
      properties:
        success: { type: boolean }
        message: { type: string }
        tested_at: { type: string, format: date-time }
        mock: { type: boolean }
    Job:
      type: object
      required: [id, automation_id, automation_name, server_id, server_name, requested_by_user_id, requested_by, status, parameters, change_number, business_reason, submitted_at, started_at, completed_at, duration_seconds, sanitized_stdout, sanitized_stderr, ansible_return_code, error_summary, mock_result, cancellation_requested, events]
      properties:
        id: { type: string, format: uuid }
        automation_id: { type: string, format: uuid }
        automation_name: { type: string }
        server_id: { type: string, format: uuid }
        server_name: { type: string }
        requested_by_user_id: { type: string, format: uuid }
        requested_by: { type: string }
        parent_job_id: { type: ["string", "null"], format: uuid }
        status: { type: string, enum: [pending, validating, queued, running, successful, failed, cancelled, timed_out] }
        parameters:
          type: object
          additionalProperties: true
        change_number: { type: ["string", "null"] }
        business_reason: { type: string }
        submitted_at: { type: string, format: date-time }
        started_at: { type: ["string", "null"], format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        duration_seconds: { type: ["number", "null"] }
        sanitized_stdout: { type: ["string", "null"] }
        sanitized_stderr: { type: ["string", "null"] }
        ansible_return_code: { type: ["integer", "null"] }
        error_summary: { type: ["string", "null"] }
        mock_result: { type: boolean }
        cancellation_requested: { type: boolean }
        events:
          type: array
          items: { $ref: "#/components/schemas/JobEvent" }
    JobInput:
      type: object
      required: [automation_id, server_id, parameters, business_reason, confirmed]
      properties:
        automation_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        parameters:
          type: object
          additionalProperties: true
        change_number: { type: string }
        business_reason: { type: string, minLength: 3, maxLength: 1000 }
        confirmed: { type: boolean, const: true }
        simulate_failure: { type: boolean }
    AccountStateRequestInput:
      type: object
      additionalProperties: false
      required: [action, sam_account_name]
      properties:
        action:
          type: string
          enum: [disable_ad_account, enable_stale_account]
        sam_account_name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[A-Za-z0-9._$-]+$"
    AccountStateRequest:
      type: object
      required: [id, action, sam_account_name, status, job_id, submitted_at, requested_by]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [disable_ad_account, enable_stale_account] }
        sam_account_name: { type: string, maxLength: 20 }
        status: { type: string, enum: [awaiting_automation_integration, queued, running, successful, failed, timed_out, cancelled] }
        job_id: { type: ["string", "null"], format: uuid }
        submitted_at: { type: string, format: date-time }
        requested_by: { type: string }
    CatalogueRequestInput:
      oneOf:
        - { $ref: "#/components/schemas/PermanentAccountRequestInput" }
        - { $ref: "#/components/schemas/ConsultantAccountRequestInput" }
        - { $ref: "#/components/schemas/BitlockerKeyRequestInput" }
      discriminator:
        propertyName: catalogue
    PermanentAccountRequestInput:
      type: object
      additionalProperties: false
      required: [catalogue, parent_company, subcompany, first_name, last_name, line_manager_sam_account_name, date_of_joining, ticket_number, office, job_title, department, mobile, staff_id, last_working_day, account_type]
      properties:
        catalogue: { type: string, const: create_permanent_account }
        parent_company: { type: string, enum: [DH-HQ, DHCM, DHAM, DHE, DHGS, DHRE, Merex] }
